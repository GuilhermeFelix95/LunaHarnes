[package]
name = "lunaharness"
version = "0.1.0"
edition = "2021"

[lib]
name = "lunaharness"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Avisos do sistema quando a janela não está em foco (resposta pronta, erro, plano).
tauri-plugin-notification = "=2.5.1"
portable-pty = "0.9"
keyring = "4.2.0"
# Marketplace de plugins: confere o sha256 de cada arquivo e baixa catálogos por HTTPS (TLS com rustls).
sha2 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Imagens anexadas: o Claude recebe o arquivo em base64 no stdin.
base64 = "0.22.1"
toml_edit = "0.25.17"
