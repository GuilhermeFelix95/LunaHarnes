<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#3b2a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#8fa8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aab6d6"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#ffffff"/>
      <circle cx="606" cy="438" r="262" fill="#000000"/>
    </mask>
  </defs>

  <!-- Quadrado arredondado: o formato dos ícones do sistema -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- Órbita com os três agentes -->
  <ellipse cx="512" cy="512" rx="390" ry="150" transform="rotate(-20 512 512)"
           fill="none" stroke="#8fa8ff" stroke-opacity="0.7" stroke-width="18"/>
  <circle cx="878" cy="379" r="34" fill="#ffffff"/>
  <circle cx="373" cy="701" r="30" fill="#b9a7ff"/>
  <circle cx="284" cy="457" r="30" fill="#3ddc97"/>

  <!-- Lua crescente à frente da órbita -->
  <circle cx="512" cy="512" r="300" fill="url(#moon)" mask="url(#crescent)"/>
</svg>
